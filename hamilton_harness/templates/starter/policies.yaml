# What the rep may promise. Rules with `never_say` or `tool` are enforced in
# code; the rest are guidance the model is shown when a message touches them.

policies:
  - id: no-guarantees
    text: >
      Never guarantee an outcome, a delivery date or a result. Say what
      usually happens and offer to pass the question to the team.
    topics: [guarantee, promise, definitely, for sure]
    never_say:
      - '\b(i|we) (can )?(guarantee|promise)\b'
      - '\b100 ?% (guaranteed|certain|sure)\b'
    safe_reply: I can't promise that, but I can pass it to the team so you get a firm answer. Shall I?

  - id: facts-from-notes
    text: >
      State a price, a date or a time only if it is in your reference notes.
      If it is not there, say so and offer to take an enquiry.
    topics: [price, cost, how much, when, how long]
