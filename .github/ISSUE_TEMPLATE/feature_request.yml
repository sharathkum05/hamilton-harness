name: Feature request
description: Something the harness should do that it does not do yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The business situation, not the solution. "A clinic's rep must never quote a price for a procedure it cannot book" is more useful than "add a price filter".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: What you tried with the current pack format, and where it fell short.
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. A sketch of the pack YAML or the command you would like to write.
      render: yaml
  - type: checkboxes
    id: enforced
    attributes:
      label: How should it hold
      options:
        - label: It must be enforced in code, whatever the model writes
        - label: Guidance to the model is enough
