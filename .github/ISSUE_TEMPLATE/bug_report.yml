name: Bug report
description: The harness did something it should not have, or failed to do something it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. If it is a security problem, please do not file it here: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: >
        The most useful thing is a fake customer that fails: a scenario from
        tests/scenarios.yaml with the pack it runs against. A command and its
        output is the next best.
      render: yaml
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Guardrails (scope, policy guard, grounding, handoff)
        - Packs and the loader
        - Simulator and scenarios
        - Web chat or embed script
        - Dashboard
        - MCP server or the npm package
        - Documentation
        - Something else
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Which model was answering
      options:
        - Replay or scripted model
        - Offline stand-in model
        - The real model
        - Not relevant
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you are on, and your Python and Node versions.
