name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest -q
      - name: Pack warnings
        # A demo pack whose own lines break its own rules fails the build.
        run: |
          hamilton-harness validate packs/loop-sneakers --strict
          hamilton-harness validate packs/brightside-dental --strict
          hamilton-harness validate packs/kestrel-lettings --strict
      - name: Fake customers (replay)
        # The gate: a change that lets a blocked action through fails the build.
        run: |
          hamilton-harness sim packs/loop-sneakers
          hamilton-harness sim packs/brightside-dental
          hamilton-harness sim packs/kestrel-lettings

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Type-check and build
        run: npm run build

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - run: npm ci
      - run: npm test
