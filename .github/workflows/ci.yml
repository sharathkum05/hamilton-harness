name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    services:
      # The database tests run on SQLite everywhere and on this Postgres here.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hamilton
          POSTGRES_PASSWORD: hamilton
          POSTGRES_DB: hamilton_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hamilton"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        env:
          HAMILTON_TEST_DATABASE_URL: postgresql://hamilton:hamilton@localhost:5432/hamilton_test
        run: pytest -q
      - name: Pack warnings
        # A demo pack whose own lines break its own rules fails the build.
        run: |
          hamilton-harness validate packs/loop-sneakers --strict
          hamilton-harness validate packs/brightside-dental --strict
          hamilton-harness validate packs/kestrel-lettings --strict
      - name: Fake customers (replay)
        # The gate: a change that lets a blocked action through fails the build.
        run: |
          hamilton-harness sim packs/loop-sneakers
          hamilton-harness sim packs/brightside-dental
          hamilton-harness sim packs/kestrel-lettings

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Type-check and build
        run: npm run build

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    # The demo, walked through in a real browser: harness, guardrails, dashboard,
    # an agent over MCP, and the chat on an existing HTML and PHP site.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            packages/cli/package-lock.json
            e2e/package-lock.json
      - name: Build the web app
        run: npm --prefix web ci && npm --prefix web run build
      - run: npm --prefix packages/cli ci
      - run: npm --prefix e2e ci
      - name: Install the browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Walk through the demo
        working-directory: e2e
        run: npx playwright test --project=local
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
