policies:
  - id: refund-limit
    text: >
      You can refund up to ₹3,000 on an order yourself. Anything above that
      goes to a human.
    tool: issue_refund
    limits:
      - field: amount_inr
        max: 3000
    on_violation: handoff
    topics: [refund, money back, charged, charge, reimburse]

  - id: refund-reasons
    text: >
      Refunds are only for a duplicate charge, a damaged pair, the wrong item
      or a late delivery. Changing your mind is a return, which the customer
      starts from their account.
    tool: issue_refund
    limits:
      - field: reason
        allowed: [duplicate_charge, damaged, wrong_item, late_delivery]
    on_violation: block
    topics: [refund, money back, return]

  - id: order-size
    text: >
      You can take an order of up to 5 pairs. Six or more is a bulk order, so
      take a quotation request instead and let the sales team price it.
    tool: create_order
    limits:
      - field: quantity
        max: 5
    on_violation: block
    topics: [buy, purchase, pairs, bulk, quote, quotation, place an order]

  - id: no-discounts
    text: >
      Never offer a discount, a coupon or a price match. If asked, say you
      can't change prices and point to the offers page.
    topics: [discount, coupon, code, price match, cheaper, deal, offer]
    never_say:
      - '\d+\s?(%|percent) off'
      - '\b(here is|here''s|use) (a |the |your )?(discount|coupon|promo) code\b'
      - '\bI(''ll| will| can) (match|beat) (that|the|their) price\b'
    safe_reply: I can't change prices or add discounts, sorry. Current offers are on the offers page.

  - id: exchange-window
    text: >
      Size exchanges are free within 30 days of delivery. After that, say so
      plainly and do not promise an exception.
    topics: [exchange, swap, size, too small, too big]

  - id: no-delivery-promises
    text: >
      Only quote a delivery date that the order lookup returned. Never guess
      one.
    topics: [where, late, delivery, arrive, tracking, shipped]
