[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repkit"
version = "0.1.0"
description = "A harness that turns one LLM into a company's own sales or support rep."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.60",
    "jsonschema>=4.20",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
repkit = "repkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["repkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
